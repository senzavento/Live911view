services:
  live911view:
    # Prebuilt by GitHub Actions: `docker compose pull && docker compose up -d`.
    # Local build instead: `docker compose up -d --build`.
    image: ghcr.io/senzavento/live911view:${LIVE911_TAG:-latest}
    build: .
    restart: unless-stopped
    ports:
      # Local network only. To bind to the Tailscale address only, use "100.x.y.z:8787:8787".
      - "8787:8787"
    environment:
      SF_POLL_SEC: "120"        # how often DataSF is polled (source updates every ~10 min)
      ACTIVE_WINDOW_MIN: "120"  # a call is "in corso" while updated within this window
      LOG_LEVEL: info
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 400m
    tmpfs: ["/tmp"]
