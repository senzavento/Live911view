services:
  live911view:
    # Prebuilt by GitHub Actions: `docker compose pull && docker compose up -d`.
    # Local build instead: `docker compose up -d --build`.
    image: ghcr.io/senzavento/live911view:${LIVE911_TAG:-latest}
    build: .
    restart: unless-stopped
    ports:
      # Local network only. To bind to the Tailscale address only, use "100.x.y.z:8787:8787".
      - "8787:8787"
    environment:
      SIM_RATE: "8"          # new incidents/s nationwide (16 = ~5k active)
      LOG_LEVEL: info
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 400m
    tmpfs: ["/tmp"]
